name: Part 2 - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore packages
      run: dotnet restore RaceDay.slnx

    - name: Build project
      run: dotnet build RaceDay.slnx --no-restore

    - name: Run tests
      run: dotnet test RaceDay.slnx --no-build

    - name: Success
      run: echo "Build and tests succeeded!"